name: Build AviumUI for Xaga

on:
  workflow_dispatch:
  push:
    branches: [ avium-16 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout manifest
      uses: actions/checkout@v4
      
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex \
        g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
        lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
        libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
        rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Configure git
      run: |
        git config --global user.name "kAi-Xin-02"
        git config --global user.email "star.light0x.2@gmail.com"
        
    - name: Initialize repo
      run: |
        mkdir -p ~/avium
        cd ~/avium
        repo init -u https://github.com/kAi-Xin-02/android_manifests.git -b avium-16 --depth=1
        
    - name: Sync source
      run: |
        cd ~/avium
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
    - name: Build ROM
      run: |
        cd ~/avium
        source build/envsetup.sh
        lunch avium_xaga-userdebug
        mka bacon -j$(nproc --all)
        
    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: AviumUI-xaga-${{ github.run_number }}
        path: ~/avium/out/target/product/xaga/*.zip
